<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Al Alameen Attendance</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .card h2 {
            margin: 0 0 10px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .buttons {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        button {
            padding: 18px;
            border: none;
            border-radius: 10px;
            background: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e5e7eb;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<header>
    <h1>Al Alameen Attendance System</h1>
    <p>Al Alameen Store</p>
</header>

<div class="container">

    <div class="welcome">
        <h2>Dashboard</h2>
        <p>Welcome to the Attendance Management System</p>
    </div>

    <div class="cards">

        <div class="card">
            <h2>Employees</h2>
            <div class="number">7</div>
        </div>

        <div class="card">
            <h2>Today's Attendance</h2>
            <div class="number">0</div>
        </div>

        <div class="card">
            <h2>Branch</h2>
            <p>Al Alameen Store</p>
        </div>

        <div class="card">
            <h2>Date</h2>
            <p id="date"></p>
        </div>

    </div>

    <div class="buttons">

        <button onclick="alert('Employees')">
            👥 Employees
        </button>

        <button onclick="alert('Shift Schedule')">
            📅 Shift Schedule
        </button>

        <button onclick="alert('Import Excel')">
            📥 Import Excel
        </button>

        <button onclick="alert('Export Excel')">
            📤 Export Excel
        </button>

        <button onclick="alert('Attendance')">
            🕐 Attendance
        </button>

        <button onclick="alert('Reports')">
            📊 Reports
        </button>

    </div>

</div>

<footer>
    Al Alameen Attendance System
</footer>

<script>
    document.getElementById("date").textContent =
        new Date().toLocaleDateString("en-GB");
</script>

</body>

</html>
