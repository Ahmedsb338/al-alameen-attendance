<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Al Alameen Attendance System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .header {
            background: #111827;
            color: white;
            padding: 25px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            margin: 8px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 25px 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 5px;
        }

        .welcome p {
            color: #6b7280;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 30px;
            font-weight: bold;
        }

        .menu-title {
            margin-bottom: 15px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .menu button {
            border: none;
            border-radius: 10px;
            padding: 18px;
            background: white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            font-size: 16px;
            cursor: pointer;
            text-align: left;
        }

        .menu button:hover {
            background: #eef2ff;
        }

        .message {
            margin-top: 25px;
            padding: 18px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Al Alameen Attendance System</h1>
        <p>Al Alameen Store</p>
    </div>

    <div class="container">

        <div class="welcome">
            <h2>Dashboard</h2>
            <p>Welcome to Al Alameen Attendance Management System</p>
        </div>

        <div class="cards">

            <div class="card">
                <div class="card-title">Employees</div>
                <div class="card-value" id="employeeCount">7</div>
            </div>

            <div class="card">
                <div class="card-title">Today's Attendance</div>
                <div class="card-value" id="attendanceCount">0</div>
            </div>

            <div class="card">
                <div class="card-title">Today's Date</div>
                <div class="card-value" id="todayDate">-</div>
            </div>

        </div>

        <h2 class="menu-title">System Management</h2>

        <div class="menu">

            <button onclick="showMessage('Employees')">
                👥 Employees
            </button>

            <button onclick="showMessage('Shift Schedule')">
                📅 Shift Schedule
            </button>

            <button onclick="showMessage('Import Excel')">
                📥 Import Excel
            </button>

            <button onclick="showMessage('Export Excel')">
                📤 Export Excel
            </button>

            <button onclick="showMessage('Attendance')">
                🕐 Attendance
            </button>

            <button onclick="showMessage('Reports')">
                📊 Reports
            </button>

        </div>

        <div class="message" id="message">
            System is ready.
        </div>

    </div>

    <div class="footer">
        Al Alameen Attendance System
    </div>

    <script>

    // ================================
    // SUPABASE CONFIGURATION
    // ================================

    const SUPABASE_URL =
        "https://lwbyjnzpmtlflhsywtcw.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_BeMQaIT1VmSjOb9B4t8VdA_QQAkS-j";


    // ================================
    // TODAY
    // ================================

    const today = new Date();

    const todayDate =
        today.toLocaleDateString("en-CA");

    document.getElementById("todayDate").textContent =
        today.toLocaleDateString("en-GB");


    // ================================
    // SUPABASE REQUEST
    // ================================

    async function supabaseRequest(endpoint) {

        const response = await fetch(
            SUPABASE_URL + endpoint,
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Content-Type": "application/json"
                }
            }
        );

        if (!response.ok) {
            throw new Error(
                "Supabase error: " + response.status
            );
        }

        return await response.json();
    }


    // ================================
    // LOAD EMPLOYEE COUNT
    // ================================

    async function loadEmployeeCount() {

        try {

            const employees =
                await supabaseRequest(
                    "/rest/v1/employees?select=id&active=eq.true"
                );

            document.getElementById("employeeCount").textContent =
                employees.length;

        } catch (error) {

            console.error(error);

            document.getElementById("employeeCount").textContent =
                "Error";
        }
    }


    // ================================
    // LOAD TODAY'S ATTENDANCE
    // ================================

    async function loadAttendanceCount() {

        try {

            const startOfDay =
                todayDate + "T00:00:00";

            const tomorrow = new Date(today);

            tomorrow.setDate(
                tomorrow.getDate() + 1
            );

            const endOfDay =
                tomorrow.toISOString();


            const attendance =
                await supabaseRequest(
                    "/rest/v1/attendance" +
                    "?select=id" +
                    "&recorded_at=gte." + encodeURIComponent(startOfDay) +
                    "&recorded_at=lt." + encodeURIComponent(endOfDay)
                );


            document.getElementById("attendanceCount").textContent =
                attendance.length;

        } catch (error) {

            console.error(error);

            document.getElementById("attendanceCount").textContent =
                "Error";
        }
    }


    // ================================
    // BUTTONS
    // ================================

    function showMessage(section) {

        document.getElementById("message").textContent =
            section + " section will be available here.";

    }


    // ================================
    // START DASHBOARD
    // ================================

    loadEmployeeCount();

    loadAttendanceCount();

</script>

</body>
</html>
<!-- Al Alameen Attendance v2 -->
