    <div

        <h3>
            ÃƒÂ°Ã…Â¸Ã‚ÂÃ‚Â¢ Branch Settings

        <div class="form-grid">


            <div class="form-group">

                <label for="settingsBranchName">
                    Branch Name
                </label>

                <input
                    type="text"
                    id="settingsBranchName"
                    placeholder="Branch Name"
                >

            </div>


            <div class="form-group">

                <label for="settingsBranchCode">

                </label>

                <input

                    readonly

            <div class="form-group">

                <label for="settingsManagerName">

                </label>

                <input

                >

            </div>


            <div class="form-group">

                    Manager Email
                </label>

                <input
                    type="email"
                    id="settingsManagerEmail"
                    placeholder="Manager Email"
                >

            </div>


            <div class="form-group">

                <label for="settingsManagerPhone">
                    Manager Phone
                </label>

                <input
                    type="tel"
                    id="settingsManagerPhone"
                    placeholder="Manager Phone"
                >

            </div>


            <div class="form-group">

                <label for="settingsLatitude">
                    Latitude
                </label>

                <input
                    type="number"
                    id="settingsLatitude"
                    step="any"
                    placeholder="Latitude"
                >

            </div>


            <div class="form-group">

                <label for="settingsLongitude">
                    Longitude
                </label>

                <input
                    type="number"
                    id="settingsLongitude"
                    step="any"
                    placeholder="Longitude"
                >

            </div>


            <div class="form-group">

                <label for="settingsRadius">
                    Allowed Radius (meters)
                </label>

                <input
                    type="number"
                    id="settingsRadius"
                    min="1"
                    placeholder="50"
                >

            </div>

        </div>
