<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Branches - Quantech Attendance System</title>

    <link
        rel="stylesheet"
        href="CSS/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


<header>

    <div class="header-content">

        <div class="header-brand">

            <h1>
                Quantech Attendance System
            </h1>

            <p>
                <span id="branchHeaderName"></span>
            </p>

            <div class="user-header-info">

                <span id="headerUserName">
                    -
                </span>

                <span id="headerUserRole">
                    -
                </span>

            </div>

        </div>


        <div class="header-actions">

            <button
                type="button"
                class="logout-button"
                onclick="logoutUser()"
            >
                Logout
            </button>

        </div>

    </div>

</header>



<section
    id="branchesPage"
    class="page active"
>


    <!-- ============================================= -->
    <!-- PAGE HEADER -->
    <!-- ============================================= -->

    <div class="page-header">

        <div>

            <h2>
                <i class="fa-solid fa-code-branch"></i>
                Branch Management
            </h2>

            <p>
                Create and manage company branches.
            </p>

        </div>


        <div>
        <div>

            <button
                type="button"
                class="primary"
                onclick="window.location.href='add-branch.html'"
            >

                <i class="fa-solid fa-plus"></i>

                Add Branch

                </button>


                <button
                    type="button"
                    class="secondary"
                    onclick="window.location.href='edit-branch.html'"
                >

                    <i class="fa-solid fa-pen-to-square"></i>

                    Edit Branch

                </button>

            </div>

        </div>

    </div>



    <!-- ============================================= -->
    <!-- EXISTING BRANCHES -->
    <!-- ============================================= -->

    <div class="card">

        <h3>
            Existing Branches
        </h3>


        <div
            id="branchesStatus"
            class="status loading"
        >
            Loading branches...
        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>
                            Branch Code
                        </th>

                        <th>
                            Branch Name
                        </th>

                        <th>
                            Manager
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="branchesTable"></tbody>

            </table>

        </div>

    </div>


</section>



<footer>

    © 2026 Ahmed Sobhy. All rights reserved.

</footer>



<!-- ============================================= -->
<!-- JAVASCRIPT -->
<!-- ============================================= -->

<script src="JS/config.js"></script>

<script src="JS/api.js"></script>

<script src="JS/auth.js"></script>

<script src="JS/app.js"></script>

<script src="JS/passkey.js"></script>

<script src="JS/branches.js"></script>


</body>

</html>
