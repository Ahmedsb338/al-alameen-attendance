<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Quantech Attendance System</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>
       
</head>

<body>

<header>

    <div class="header-content">

        <div class="header-brand">

            <h1>
                Quantech Attendance System
            </h1>

            <p>
                <span id="branchHeaderName">
                    
                </span>
            </p>

            <div class="user-header-info">

                <span id="headerUserName">
                    -
                </span>

                <span id="headerUserRole">
                    -
                </span>

            </div>

        </div>

        <div class="header-actions">

            <button
                type="button"
                class="logout-button"
                onclick="logoutUser()"
            >
                Logout
            </button>

        </div>

    </div>

</header>

<section
    id="schedulePage"
    class="page active"
>


    <div class="page-header">

        <h2>Shift Schedule</h2>

        <p>
            Monthly employee shift schedule.
        </p>

    </div>

    <div
        id="scheduleStatus"
        class="status loading"
    >
        Loading schedule...
    </div>
        
    <div class="table-container">

        <table class="schedule-table">

            <thead>

                <tr>

                    <th>Date</th>

                    <th>121090</th>
                    <th>121040</th>
                    <th>125453</th>
                    <th>126439</th>
                    <th>127981</th>
                    <th>126225</th>
                    <th>129776</th>

                </tr>

            </thead>

            <tbody id="scheduleTable"></tbody>

        </table>

    </div>

    <div class="schedule-save-container">
    <button
        type="button"
        id="saveScheduleButton"
        class="schedule-save-button"
        onclick="saveScheduleChanges()"
    >
        Save Changes
    </button>
    </div>

</section>

<footer>
    © 2026 Ahmed Sobhy. All rights reserved.
</footer>
    <!-- =====================================================
        JAVASCRIPT
    ====================================================== -->
        <script src="JS/config.js"></script>
        <script src="JS/api.js"></script>
        <script src="JS/auth.js"></script>
        <script src="JS/app.js"></script>

        <script src="JS/schedule.js"></script>

        <script>
        document.addEventListener("DOMContentLoaded", async () => {

            if (!localStorage.getItem("access_token")) {
                return;
            }

            // Wait until auth.js finishes loading the user profile
            let attempts = 0;

            while (
                !window.currentUserProfile &&
                attempts < 50
            ) {
                await new Promise(resolve =>
                    setTimeout(resolve, 100)
                );

                attempts++;
            }

            if (typeof loadSchedule === "function") {
                await loadSchedule();
            }

        });
        </script>

</body>
</html>
