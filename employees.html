<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quantech Attendance System</title>

    <link
        rel="stylesheet"
        href="CSS/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>

<body>

<header>

    <div class="header-content">

        <div class="header-brand">

            <h1>
                Quantech Attendance System
            </h1>

            <p>
                <span id="branchHeaderName"></span>
            </p>

            <div class="user-header-info">

                <span id="headerUserName">
                    -
                </span>

                <span id="headerUserRole">
                    -
                </span>

            </div>

        </div>

        <div class="header-actions">

            <button
                type="button"
                class="logout-button"
                onclick="logoutUser()"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<section
    id="employeesPage"
    class="page active"
>


    <div class="page-header">

        <h2>
            Employees
        </h2>

        <p>
            Manage employees and employee accounts.
        </p>

    </div>


    <div class="card">
    <h3>Add New Employee</h3>
    <p>Create a new employee account and assign it to a branch.</p>

    <button
        type="button"
        class="primary"
        onclick="window.location.href='new-employee.html'"
    >
        Add New Employee
    </button>
</div>

    <div class="card">

        <h3>
            Employee List
        </h3>


        <div
            id="employeesStatus"
            class="status loading"
        ></div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>
                        <th>Staff ID</th>
                        <th>Full Name</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="employeesTable"></tbody>

            </table>

        </div>

    </div>

</section>



<footer>
    © 2026 Ahmed Sobhy. All rights reserved.
</footer>

    <script src="JS/config.js"></script>
    <script src="JS/api.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/app.js"></script>
    <script src="JS/passkey.js"></script>


<!-- =====================================================
     PASSKEY
     ===================================================== -->

<script src="https://unpkg.com/@simplewebauthn/browser@13.3.0/dist/bundle/index.umd.min.js"></script>

<script src="JS/passkey.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    if (!localStorage.getItem("access_token")) {
        return;
    }

    await loadEmployees();
    await loadEmployeeBranches();
});
</script>

</body>

</html>
